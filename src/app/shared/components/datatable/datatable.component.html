<div class="card bg-white rounded-lg border border-border shadow-sm overflow-hidden">
  <p-table
    [value]="items"
    [columns]="columns"
    [paginator]="paginator && items.length > rows"
    [rows]="rows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [tableStyle]="{ 'min-width': '50rem' }"
    styleClass="p-datatable-sm p-datatable-striped"
  >
    <ng-template #header let-columns>
      <tr>
        @for (col of columns; track col.field) {
          <th
            [pSortableColumn]="col.field"
            [style.width]="col.width"
            [style.text-align]="col.align || 'left'"
            class="bg-muted/40 font-medium text-foreground py-3 px-4 text-xs tracking-wider uppercase border-b border-border"
          >
            <div class="flex items-center gap-2">
              <span>{{ col.header }}</span>
              <p-sortIcon [field]="col.field" />
            </div>
          </th>
        }
        @if (commandsTemplateRef) {
          <th class="bg-muted/40 font-medium text-foreground py-3 px-4 text-xs tracking-wider uppercase text-right border-b border-border">
            Ações
          </th>
        }
      </tr>
    </ng-template>

    <ng-template #body let-rowData let-columns="columns">
      <tr class="hover:bg-muted/20 transition-colors border-b border-border last:border-0">
        @for (col of columns; track col.field) {
          <td class="py-3 px-4 text-sm text-foreground align-middle" [style.text-align]="col.align || 'left'">
            {{ rowData[col.field] }}
          </td>
        }
        @if (commandsTemplateRef) {
          <td class="py-3 px-4 text-sm align-middle text-right">
            <ng-container
              [ngTemplateOutlet]="commandsTemplateRef"
              [ngTemplateOutletContext]="{ $implicit: rowData }"
            ></ng-container>
          </td>
        }
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td [attr.colspan]="columns.length + (commandsTemplateRef ? 1 : 0)" class="text-center py-8 text-muted-foreground text-sm">
          Nenhum registro encontrado.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
