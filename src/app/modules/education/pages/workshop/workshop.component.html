<app-page-layout
  title="Oficinas"
  description="Gerencie as oficinas e atividades educacionais"
>
  <lucide-icon page-icon [img]="icons.briefcase" [size]="24" class="text-blue-600"></lucide-icon>

  <div page-filters>
    <app-workshop-search
      (searchCompleted)="showListResult($event)"
      (createWorkshop)="handleCreateWorkshop()"
      (createSession)="handleCreateSession()"
    ></app-workshop-search>
  </div>

  <app-workshop-list
    [workshops]="workshops"
    (viewWorkshopDetail)="showWorkshopDetails($event)"
  ></app-workshop-list>
</app-page-layout>
