<app-page-layout
  title="Funcionários"
  description="Gerencie os funcionários da instituição"
>
  <lucide-icon page-icon [img]="icons.briefcase" [size]="24" class="text-blue-600"></lucide-icon>

  <div page-filters>
    <app-employee-search
      (searchCompleted)="showListResult($event)"
      (createEmployee)="openCreationDialog()"
    ></app-employee-search>
  </div>

  <app-employee-list
    [employees]="employees()"
    (viewEmployeeDetail)="showEmployeeDetails($event)"
  ></app-employee-list>
</app-page-layout>
