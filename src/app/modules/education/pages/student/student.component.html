<app-page-layout
  title="Gerenciar estudantes"
  description="Pesquise, visualize e gerencie registros de estudantes."
>
  <lucide-icon page-icon [img]="icons.users" size="24" class="text-green-600" />

  <div page-filters>
    <app-student-search (searchCompleted)="setStudentPreviewList($event)">
      <button
        appButton
        (click)="handleCreateStudent(undefined)"
        class="bg-green-600 hover:bg-green-700"
      >
        <lucide-icon [img]="icons.userPlus" size="18" class="mr-2" />
        Adicionar Estudante
      </button>
    </app-student-search>
  </div>

  <app-student-list [students]="students" (viewStudentDetail)="showStudentDetails($event)" />
</app-page-layout>
